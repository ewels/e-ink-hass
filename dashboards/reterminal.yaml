# Snapshot of the live Home Assistant "E-ink" dashboard (url_path: e-ink).
#
# Source-of-truth backup of the dashboard, which otherwise lives only in HA's
# .storage (that has rolled back on an unclean reboot before). To restore: open
# the E-ink dashboard -> ⋮ -> Edit dashboard -> ⋮ -> Raw configuration editor ->
# replace everything with this file's contents.
#
# Contains real entity IDs (calendars, waste sensors, greenely price) and
# card-mod styling. Requires the HACS cards calendar-card-pro and card-mod, plus
# the bundled eink-dashboard-cards (eink-weather-card, eink-price-card). The
# views use theme: eink (see ha/themes/eink.yaml).
#
# Generated from the live dashboard via the HA WebSocket API. Last synced:
# 2026-11-02. To refresh, re-run scratchpad/snapshot-dashboard.mjs.

title: E-ink
views:
  - title: Panel
    path: panel
    panel: true
    type: panel
    theme: eink
    icon: mdi:tablet-dashboard
    show_icon_and_title: true
    cards:
      - type: vertical-stack
        card_mod:
          style: '#root { height: 100%; } #root > hui-card:last-child { margin-top: auto; }'
        cards:
          - type: markdown
            # ponytail: linear 3.3-4.2 V -> 0-100 %; Li-ion isn't linear, swap for a lookup if readings mislead.
            content: >-
              {% set p = ((states('sensor.reterminal_e_ink_reterminal_battery_voltage')|float(0) - 3.3) / 0.9 * 100)|round|int %}
              {% set p = [0, [p, 100]|min]|max %}
              <ha-icon icon="mdi:battery{{ '-outline' if p < 5 else '' if p > 95 else '-' ~ ((p / 10)|round|int * 10) }}"></ha-icon> {{ p }}%
            card_mod:
              style: |-
                ha-card { position: absolute; top: 0; right: 0; z-index: 1; width: auto; height: auto; background: none; border: 0; box-shadow: none; font-size: 20px; font-weight: 700; color: {{ '#ff0000' if ((states('sensor.reterminal_e_ink_reterminal_battery_voltage')|float(0) - 3.3) / 0.9 * 100)|round|int <= 15 else '#000000' }}; }
                ha-markdown { padding: 4px 8px !important; }
          - type: horizontal-stack
            card_mod:
              style: '#root { justify-content: flex-start; gap: 24px; } #root > hui-card > * { flex: 0 0 auto !important; }'
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:eink-weather-card
                    entity: weather.forecast_home
                    days: 0
              - type: horizontal-stack
                card_mod:
                  style: '#root > hui-card > * { flex: 0 0 170px !important; }'
                cards:
                  - type: tile
                    entity: sensor.waste_collection_schedule_matavfall
                    name: Matavfall
                    icon: mdi:food-apple-outline
                    vertical: true
                    state_content: state
                    card_mod:
                      style:
                        ha-tile-icon $: '.container { width: 92px !important; height: 92px !important; background: none !important; } .container::before { display: none !important; } ::slotted([slot="icon"]) { --mdc-icon-size: 62px !important; color: #000000 !important; }'
                        ha-tile-info $: '.primary { font-size: 20px !important; font-weight: 400 !important; } .secondary { font-size: 20px !important; }'
                        .: 'ha-card { box-shadow: none; border: 0; background: {% set s = states(config.entity)|lower %}{% set t = s.split(" ")[0] %}{% if "today" in s or "tomorrow" in s or t=="0" or t=="1" %}#ff0000{% elif t=="2" %}#ff8000{% else %}transparent{% endif %} !important; }'
                  - type: tile
                    entity: sensor.waste_collection_schedule_papper_och_plast
                    name: Papper & plast
                    icon: mdi:recycle
                    vertical: true
                    state_content: state
                    card_mod:
                      style:
                        ha-tile-icon $: '.container { width: 92px !important; height: 92px !important; background: none !important; } .container::before { display: none !important; } ::slotted([slot="icon"]) { --mdc-icon-size: 62px !important; color: #000000 !important; }'
                        ha-tile-info $: '.primary { font-size: 20px !important; font-weight: 400 !important; } .secondary { font-size: 20px !important; }'
                        .: 'ha-card { box-shadow: none; border: 0; background: {% set s = states(config.entity)|lower %}{% set t = s.split(" ")[0] %}{% if "today" in s or "tomorrow" in s or t=="0" or t=="1" %}#ff0000{% elif t=="2" %}#ff8000{% else %}transparent{% endif %} !important; }'
          - type: custom:eink-price-card
            entity: sensor.greenely_prices
            title: Electricity
            low_threshold: 50
            high_threshold: 200
            cheapest_window: 12
  - title: Panel - calendar
    path: panel-calendar
    panel: true
    type: panel
    theme: eink
    icon: mdi:tablet-dashboard
    show_icon_and_title: true
    cards:
      - type: vertical-stack
        card_mod:
          style: '#root { height: 100%; } #root > hui-card:last-child { margin-top: auto; }'
        cards:
          - type: markdown
            # ponytail: linear 3.3-4.2 V -> 0-100 %; Li-ion isn't linear, swap for a lookup if readings mislead.
            content: >-
              {% set p = ((states('sensor.reterminal_e_ink_reterminal_battery_voltage')|float(0) - 3.3) / 0.9 * 100)|round|int %}
              {% set p = [0, [p, 100]|min]|max %}
              <ha-icon icon="mdi:battery{{ '-outline' if p < 5 else '' if p > 95 else '-' ~ ((p / 10)|round|int * 10) }}"></ha-icon> {{ p }}%
            card_mod:
              style: |-
                ha-card { position: absolute; top: 0; right: 0; z-index: 1; width: auto; height: auto; background: none; border: 0; box-shadow: none; font-size: 20px; font-weight: 700; color: {{ '#ff0000' if ((states('sensor.reterminal_e_ink_reterminal_battery_voltage')|float(0) - 3.3) / 0.9 * 100)|round|int <= 15 else '#000000' }}; }
                ha-markdown { padding: 4px 8px !important; }
          - type: horizontal-stack
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:eink-weather-card
                    entity: weather.forecast_home
                    days: 0
              - type: custom:calendar-card-pro
                days_to_show: 3
                time_24h: true
                show_location: true
                entities:
                  - entity: calendar.freyaewels_gmail_com
                    color: '#a032a8'
                  - entity: calendar.ewelsphil_gmail_com
                    color: '#00ff00'
                  - entity: calendar.phil_ewels_seqera_io
                    color: '#0000ff'
          - type: custom:eink-price-card
            entity: sensor.greenely_prices
            title: Electricity
            low_threshold: 50
            high_threshold: 200
            cheapest_window: 12
  - type: panel
    path: photo
    title: Photo
    theme: eink
    icon: mdi:panorama-variant-outline
    show_icon_and_title: true
    cards:
      - type: picture
        image:
          media_content_id: media-source://image_upload/21421b58b92c459fe3d748eb4f7dc1b1
          media_content_type: image/jpeg
          metadata:
            title: IMG_8646.JPG
            thumbnail: /api/image/serve/21421b58b92c459fe3d748eb4f7dc1b1/256x256
            media_class: image
            navigateIds:
              - {}
              - media_content_type: app
                media_content_id: media-source://image_upload
